services:
  mysql:
    build: ./database
    container_name: mysql-db
    env_file: ./database/.env.docker
    healthcheck:
      test:
        [
        "CMD-SHELL",
        "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    container_name: backend
    env_file: ./backend/.env.docker
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend
    env_file: ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend

