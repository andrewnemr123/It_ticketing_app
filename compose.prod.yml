services:
  mysql:
    build: ./database
    container_name: it-ticketing-mysql-prod
    restart: always
    env_file: ./database/.env.docker
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: it-ticketing-backend-prod
    restart: always
    env_file: ./backend/.env.docker
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: it-ticketing-frontend-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:

