services:
  mysql:
    build: ./database
    container_name: it-ticketing-mysql-prod
    restart: always
    env_file: ./database/.env.docker
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: it-ticketing-backend-prod
    restart: always
    env_file: ./backend/.env.docker
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: it-ticketing-frontend-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: it-ticketing-grafana-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  backend_uploads:
  grafana_data:


